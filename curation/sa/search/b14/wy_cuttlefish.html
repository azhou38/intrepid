- a privileged experience exclusive to Whyalla."},{"key":"TileTitle","value":"Giant Cuttlefish"},{"key":"TileButtonText","value":""},{"key":"TileDesc","value":"A mecca for divers wishing to witness a mesmerising underwater spectacle of the courtship displays and the extent of the world’s largest aggregation of Giant Australian Cuttlefish - a privileged experience exclusive to Whyalla."},{"key":"Subtitle","value":""},{"key":"ColorTheme","value":"orange"}],"sections":[{"sectionName":"Main","items":[{"itemTypeCode":"SingleBanner","cssClass":null,"anchorName":null,"itemId":"6ca0e5b4-15b2-461a-b441-9f1d875e2a13","payloads":[{"key":"HeightSet","value":"standard"},{"key":"AlignV","value":"60%"},{"key":"ImageUrl","value":"/sites/whyallapwa/media/images/carlo-photo.jpg"},{"key":"CaptionTitle","value":""},{"key":"LinkUrl","value":""}],"items":[]},{"itemTypeCode":"Panel","cssClass":null,"anchorName":null,"itemId":"1027e2e7-17e0-408b-9d93-9ae900875312","payloads":[{"key":"TextColorTheme","value":""},{"key":"BgColor","value":"transparent"},{"key":"ImageUrl","value":"/sites/whyallapwa/media/misc/back-02.jpg"},{"key":"BackgroundTile","value":""}],"items":[{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"f314f621-1d3c-4af9-88dd-b59b3f72a338","payloads":[{"key":"Content","value":"<h1>GIANT <strong>CUTTLEFISH</strong></h1>\n\n<h3>THE ANNUAL MIGRATION OF THE AUSTRALIAN GIANT CUTTLEFISH &lsquo;SEPIA APAMA&rsquo; IS ONE OF THE MOST <strong>SPECTACULAR </strong>NATURAL EVENTS&nbsp;IN THE AUSTRALIAN MARINE ENVIRONMENT.</h3>\n\n<h4>This natural wonder attracts international film crews, renowned underwater photographers, divers, researchers and journalists to dive and snorkel to experience the aggregation from May to August which is unique in the world to Whyalla.</h4>\n\n<p><img alt=\"\" src=\"/sites/whyallapwa/media/gallery/credit-chris-fewster.jpg\" /></p>\n\n<h5>Giant Cuttlefish and many species of fish and sea creatures abound in the unique marine habitat off the coast of Whyalla</h5>\n\n<h5>Photo Credit: Chris Fewster</h5>\n\n<p>&nbsp;</p>\n\n<p>These &lsquo;chameleons of the sea&rsquo; are one of the largest species of cuttlefish found, reaching up to 60cm in length and weighing up to 5kg.</p>\n\n<p>The migration by these majestic creatures to these waters is for the sole purpose of spawning. Every year between May and August, they come in their tens of thousands to mate and reproduce, in the process creating an amazing spectacle of cunning games, predation, underwater light shows and colourful kaleidoscopic displays.</p>\n\n<p>Cuttlefish are intelligent creatures able to change their colour, shape and texture as they move along the seabed to imitate rocks, sand or seaweed. As males are vastly outnumbered (a gender imbalance unique to Whyalla), there is fierce and frenzied competition between males for mating privileges, leading to displays of unusual and spectacular behaviour.</p>\n\n<p>Mating takes place with the cuttlefish linking their eight arms and two tentacles for head-to-head contact, with the males slipping their sperm packages into the female&rsquo;s mouth and fertilising her eggs. The female lays tear-shaped eggs and attaches them to the underside of the rocky ledges and in rock cavities where they hatch three to five months later. It is believed they congregate here in such large numbers as it is the only area in the vicinity with rocky ledges suitable to lay eggs.</p>\n\n<p>Commercial fishing almost destroyed this world class phenomenon, therefore the cuttlefish are protected all year round (see below)</p>\n\n<h3>NO FISHING</h3>\n\n<p>The targeting and taking of all cephalopod species (squid, cuttlefish and octopus) is prohibited at all times in the cephalopod exclusion zone in waters of False Bay, Spencer Gulf, near Whyalla.</p>\n\n<p>The targeting and take of all cuttlefish species, including&nbsp;Giant Australian Cuttlefish, is prohibited at all times in the Upper Spencer Gulf in the waters north of the line between Arno Bay and Wallaroo.</p>\n\n<p><a href=\"http://www.pir.sa.gov.au/recreational_fishing/rules/species_limits/species_profile/cuttlefish\" target=\"_blank\">For more information please visit the SA Department of Primary Industry and Regions page here</a></p>\n\n<h3>DIVING &amp; SNORKELING WITH THE CUTTLEFISH</h3>\n\n<p>Contact the Whyalla Visitor Centre <a href=\"tel:1800088589\">1800 088 589</a>, for all the information you will need to see the cuttlefish. Bring your wetsuit and dive gear or hire your equipment and&nbsp;join a the team throughhout the season to experience these amazing creatures.&nbsp;</p>\n\n<p>Snorkel with a buddy, or in a small guided tour group, for a truely unique&nbsp;and&nbsp;remarkable&nbsp;experience you will never forget. &nbsp;</p>\n\n<p>Guided tours and equipment hire are offered by <a href=\"http://whyalladivingservices.com.au/\" target=\"_blank\">Whyalla Diving&nbsp;Services</a> and <a href=\"http://www.emsau.org/\" target=\"_blank\">Experiencing Marine Sanctuaries</a>.</p>\n\n<h3>DID YOU KNOW?</h3>\n\n<ul>\n\t<li>Cuttlefish are colour blind. They have &lsquo;w&rsquo; shaped pupils which are thought to allow them to see both behind and in front at the same time.</li>\n\t<li>Cuttlefish are not actually a fish. They are a cephalopod (Greek for &lsquo;head-foot&rsquo;), and their feet, or tentacles actually connect to their head rather than their body.</li>\n\t<li>Cuttlefish have blue blood, 3 hearts, 8 arms and 2 feeding tentacles.</li>\n</ul>\n\n<p>&nbsp;</p>\n"}],"items":[]},{"itemTypeCode":"AtdwSearch","cssClass":null,"anchorName":null,"itemId":"6a8eb269-5a50-4c59-bd34-8bb981c7d94e","payloads":[{"key":"TextColorTheme","value":""},{"key":"BgColor","value":"transparent"},{"key":"ImageUrl","value":""},{"key":"BackgroundTile","value":""},{"key":"ProductType","value":"ACCOMM"},{"key":"SubTypes","value":""},{"key":"AutoSearch","value":"on"},{"key":"HideSearch","value":"off"},{"key":"NumOfTileLines","value":"12"}],"items":[]},{"itemT
