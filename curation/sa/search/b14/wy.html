rd"},{"key":"PosterFrameUrl","value":"/sites/whyallapwa/media/images/carl-charter-snorkel.jpg"}],"items":[]},{"itemTypeCode":"Panel","cssClass":null,"anchorName":null,"itemId":"d03b7d68-2c63-407f-aed3-67af1e08276a","payloads":[{"key":"TextColorTheme","value":""},{"key":"BgColor","value":"transparent"},{"key":"ImageUrl","value":"/sites/whyallapwa/media/misc/back-02.jpg"},{"key":"BackgroundTile","value":""}],"items":[{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"d00c5879-c12a-45df-9e3c-075c87d32491","payloads":[{"key":"Content","value":"<h1 data-uw-rm-heading=\"level\"><strong>WHYALLA,</strong> SOUTH AUSTRALIA</h1>\n\n<h3 data-uw-rm-heading=\"prs\"><strong>UNEARTH UNFORGETTABLE EXPERIENCES</strong>; WHYALLA OFFERS NATURAL&nbsp; WONDER&nbsp;CONTRASTED<strong> </strong>WITH INDUSTRY IN VIVID LANDSCAPES, AQUATIC SERENITY, SEA LIFE AND GREAT ADVENTURES.</h3>\n\n<p>Located on Eyre Peninsula&rsquo;s Spencer Gulf in South Australia, Whyalla is an important hub and the region&rsquo;s biggest city for retail shopping. Whyalla boasts a warm climate, accessible ocean shores and saltwater fishing. Whyalla represents South Australia&rsquo;s foremost combination of industrial and nature-based experiences. With vivid scenery, small city charm, distinctive mystic outback landscapes and year-round things to do, Whyalla offers discovery, unique Australian natural wonders and absolute contrast in nature based and industrial activities. Activities that are significant to the landscape and geography of the region that will enthral and gratify those looking to unearth and experience learning, adventure time and witness unrivalled sights and happenings.</p>\n"}],"items":[]},{"itemTypeCode":"PageTiles","cssClass":null,"anchorName":null,"itemId":"5b95bb5d-f30d-4679-a1a1-6187b3df5594","payloads":[{"key":"SelectedPages","value":"beee94f3-d6ab-48b4-b31f-70dc04a0ed8c,10bdde02-a4fa-40d9-bde1-40f21d78c3a2,464e3893-01ce-4e51-85f0-ab4caed651ea,9997b0ca-3820-4bb2-a690-d47f6aed05ce  \",\"tileButtonText\":\"Unearth Accommodation >\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/aadsc03945.jpg|/sites/whyallapwa/media/images/aadsc03954.jpg|/sites/whyallapwa/media/images/foreshore-garden-view-room-(1).jpg|/sites/whyallapwa/media/images/cabinmorningvr.jpg|/sites/whyallapwa/media/images/old-main-img/quest-apt-foyer.jpg|/sites/whyallapwa/media/images/old-main-img/quest-apt-pool.jpg|/sites/whyallapwa/media/images/old-main-img/quest-apt-studio.jpg\",\"colorTheme\":\"purple\",\"subTitle\":\"Whyalla features hotels, motels and four star apartments or cabins and caravan parks if sharing road-trip stories is more your style. \",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Book a tour\",\"pageUrl\":\"/tours\",\"imageUrl\":\"/sites/whyallapwa/media/images/2025-images/ship-(15-of-19).jpg\",\"description\":\"Step aboard a WWII vessel built right here in Whyalla, Learn of steelmaking, ship building and the heritage of our beautiful region.\",\"tileDesc\":\"Step aboard a WWII vessel built right here in Whyalla, Learn of steelmaking, ship building and the heritage of our beautiful region.\",\"tileButtonText\":\"\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/2025-images/ship-(15-of-19).jpg|/sites/whyallapwa/media/images/2025-images/ship-(13-of-19).jpg|/sites/whyallapwa/media/images/2025-images/ship-(10-of-19).jpg|/sites/whyallapwa/media/images/2025-images/steelworks-at-night.jpg|/sites/whyallapwa/media/images/2025-images/steelworks-rolling-mill-(_rkp3439).jpg\",\"colorTheme\":\"jade\",\"subTitle\":\"\",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Whyalla Experiences\",\"pageUrl\":\"/experiences\",\"imageUrl\":\"/sites/whyallapwa/media/images/unearth-your-next-step--liveability/whyalla-57.jpg\",\"description\":\"Discover Whyalla’s fiery sunsets, guided steelworks tours, dolphin-spotting cruises, secluded beaches, 4WD tracks, museums, art galleries and local events – your next Eyre Peninsula adventure awaits!\",\"tileDesc\":\"Discover Whyalla’s fiery sunsets, guided steelworks tours, dolphin-spotting cruises, secluded beaches, 4WD tracks, museums, art galleries and local events.\",\"tileButtonText\":\"Unearth Experiences >\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/old-main-img/135934-19.jpg|/sites/whyallapwa/media/images/old-main-img/aadsc03812.jpg|/sites/whyallapwa/media/images/old-main-img/carlcharter-2865-jpeg.jpg|/sites/whyallapwa/media/images/old-main-img/whyallaslide2-4.jpg|/sites/whyallapwa/media/images/dolphins-in-the-marina.jpg\",\"colorTheme\":\"pink\",\"subTitle\":\"From fiery sunsets that set the sky ablaze to up-close encounters with playful dolphins, Whyalla invites you to dive into its extraordinary blend of industry, nature and culture.\",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Events Whyalla\",\"pageUrl\":\"/events\",\"imageUrl\":\"/sites/whyallapwa/media/images/mascot-at-dive-site-stony-point-06.06.2020.jpg\",\"description\":\"Unearth the vibrancy of Whyalla at local events, markets, visiting shows and exhibitions. Enjoy local craftsmanship, motor sports, festivals and live theatre and music.\",\"tileDesc\":\"Unearth the vibrancy of Whyalla at local events, markets, visiting shows and exhibitions. Enjoy local craftsmanship, motor sports, festivals and live theatre and music.\",\"tileButtonText\":\"Unearth Events >\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/old-main-img/_dsc1855.jpg|/sites/whyallapwa/media/images/old-main-img/230318markets.jpg|/sites/whyallapwa/media/images/old-main-img/chadstone3.jpg|/sites/whyallapwa/media/images/old-main-img/event.jpg|/sites/whyallapwa/media/images/old-main-img/mel-and-me.png|/sites/whyallapwa/media/images/old-main-img/img_20190419_205915.jpg\",\"colorTheme\":\"orange\",\"subTitle\":\"Whyalla's most unique event occurs May - August every year with the arrival of the Giant Australian Cuttlefish.\\r\\n\",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Eat & Drink\",\"pageUrl\":\"/eatdrink\",\"imageUrl\":\"/sites/whyallapwa/media/images/old-main-img/wine-and-cheese-platter.jpg\",\"description\":\"Whyalla’s Eat & Drink scene is a delightful fusion of fresh, locally sourced produce, coastal flavours and warm, community-driven hospitality. \",\"tileDesc\":\"Whyalla’s Eat & Drink scene is a delightful fusion of fresh, locally sourced produce, coastal flavours and warm, community-driven hospitality. \",\"tileButtonText\":\"Unearth Hospitality >\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/old-main-img/adobestock_114532171.jpg|/sites/whyallapwa/media/images/old-main-img/adobestock_45369516.jpg\",\"colorTheme\":\"violet\",\"subTitle\":\"Nestled on the rugged shores of the Spencer Gulf, Whyalla offers everything from cosy, sunlit cafés to waterside restaurants where the catch of the day is served with sweeping bay vistas.\",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Online Shop\",\"pageUrl\":\"/online-shop\",\"imageUrl\":\"/sites/whyallapwa/media/images/2025-images/whyalla-online-shop.jpg\",\"description\":\"Discover treasures from Whyalla and the Eyre Peninsula — from striking Aboriginal artworks and locally made posters to Cuttlefish memorabilia, clothing, books and the ever-popular Cuttlefish jigsaw puzzle. Every item is selected to celebrate the region’s culture, coast and stories — perfect for keepsakes, gifts or a special reminder of your visit.\",\"tileDesc\":\"Discover treasures from Whyalla and the Eyre Peninsula — from striking Aboriginal artworks and locally made posters to Cuttlefish memorabilia, clothing, books and the ever-popular Cuttlefish jigsaw puzzle.\",\"tileButtonText\":\"Unearth Merchandise >\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/2025-images/whyalla-online-shop.jpg|/sites/whyallapwa/media/products/hoodies/green-hoodie-beach-1.jpg|/sites/whyallapwa/media/products/hoodies/navyblue-hoodie-beach-2.jpg|/sites/whyallapwa/media/products/coaster-1.png|/sites/whyallapwa/media/products/coaster-5.png|/sites/whyallapwa/media/products/coaster-group.png\",\"colorTheme\":\"burnt-orange\",\"subTitle\":\"Every item is selected to celebrate the region’s culture, coast and stories — perfect for keepsakes, gifts or a special reminder of your visit.\",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null}]"}],"items":[]},{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"f29c3a00-b331-482c-b402-75579465ac8f","payloads":[{"key":"Content","value":"<p style=\"text-align: center;\">&nbsp;</p>\n\n<h3 style=\"text-align: center;\">Check out the video below and discover some of the many reasons why you should<strong> Unearth Your Next Step in Whyalla!</strong></h3>\n\n<p>&nbsp;</p>\n\n<div class=\"ytvideo\"><iframe frameborder=\"0\" src=\"//www.youtube.com/embed/IcH552Pu6N0?wmode=transparent\"></iframe></div>\n\n<h4>&nbsp;</h4>\n\n<h4><strong>You will be awed by the dramatic events and vivid colours and textures that shape Whyalla.</strong></h4>\n\n<p>Witness the spectacle the Whyalla steelworks and learn&nbsp;about the transformation of ore into steel; wonder at the antics of the local resident dolphins and feel the sand between your toes when searching for a delicious meal of fresh crab off the Whyalla Foreshore beach.</p>\n\n<p>Witness the camouflage and colourful mating rituals of Whyalla’s distinctive giant cuttlefish;&nbsp;Relax within the ocean and wonders of the unique Northern Coastline and beaches on the tranquil Spencer Gulf, set against&nbsp;backdrop&nbsp;of&nbsp;the ancient Southern Flinders Ranges.</p>\n\n<p>&nbsp;</p>\n\n<p style=\"text-align: center;\"><strong><em>Use the map below to find Accommodation options and more.<br>\nYou can also select the Grid mode for direct access to operators.</em></strong></p>\n"}],"items":[]},{"itemTypeCode":"AtdwSearchOrMap","cssClass":null,"anchorName":null,"itemId":"3fbfe70a-2130-48bf-af73-aab85361899a","payloads":[{"key":"AtdwType","value":"ALL"}],"items":[]},{"itemTypeCode":"Html","cssClass":null,"anchorName":"unearth-more","itemId":"40f9958b-65eb-40fb-b5b4-f035211c2a33","payloads":[{"key":"Content","value":"<h3 data-uw-rm-heading=\"prs\" style=\"text-align: center;\">&nbsp;</h3>\n\n<h2 data-uw-rm-heading=\"prs\" style=\"text-align: center;\"><span style=\"color:rgb(68, 167, 136)\">Unearth more about </span>Whyalla</h2>\n"}],"items":[]},{"itemTypeCode":"PageTiles","cssClass":null,"anchorName":null,"itemId":"2050d96a-d5ca-4733-88a6-79d8dd421ba9","payloads":[{"key":"SelectedPages","value":"6f26d75c-0777-4466-b175-1cbc54bc490e,3c9e390b-4db9-4823-864b-2f133fa40979,c0098128-e60d-40b2-8463-e4d7b299a1fe,053acb08-cf21-4d5c-8250-dabd3f9827c7,6f8a43b4-85f7-4dbb-bc93-b6fca026b3af,c663c1cf-b589-484d-b696-633b03795f50,7a954090-5089-44cd-94d5-2cfa8d7f09bd,10bdde02-a4fa-40d9-bde1-40f21d78c3a2,9997b0ca-3820-4bb2-a690-d47f6aed05ce,1ef220ab-5d29-468b-9934-da9543588a40"},{"key":"SubTitle","value":""},{"key":"LinkTitle","value":""},{"key":"UseSlider","value":"default"},{"key":"TileType","value":"2"},{"key":"PageObjects","value":"[{\"pageTitle\":\"Relax Must Do's\",\"pageUrl\":\"/relax-must-do\",\"imageUrl\":\"/sites/whyallapwa/media/images/dsc_3027.jpg\",\"description\":\"Beach time, show time or retail therapy. Walk along sandy beaches or in leafy gardens, watch a show or movie, relax in a spa or swim. Shop or socialise in a café or bar. Unearth your unwind place.\",\"tileDesc\":\"Beach time, show time or retail therapy. Walk along sandy beaches or in leafy gardens, watch a show or movie, relax in a spa or swim. Shop or socialise in a café or bar. Unearth your unwind place.\",\"tileButtonText\":\"\",\"bottomImageUrl\":null,\"colorTheme\":\"jade\",\"subTitle\":\"\",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"ca a-57.jpg\",\"description\":\"Discover Whyalla’s fiery sunsets, guided steelworks tours, dolphin-spotting cruises, secluded beaches, 4WD tracks, museums, art galleries and local events – your next Eyre Peninsula adventure awaits!\",\"tileDesc\":\"Discover Whyalla’s fiery sunsets, guided steelworks tours, dolphin-spotting cruises, secluded beaches, 4WD tracks, museums, art galleries and local events.\",\"tileButtonText\":\"Unearth Experiences >\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/old-main-img/135934-19.jpg|/sites/whyallapwa/media/images/old-main-img/aadsc03812.jpg|/sites/whyallapwa/media/images/old-main-img/carlcharter-2865-jpeg.jpg|/sites/whyallapwa/media/images/old-main-img/whyallaslide2-4.jpg|/sites/whyallapwa/media/images/dolphins-in-the-marina.jpg\",\"colorTheme\":\"pink\",\"subTitle\":\"From fiery sunsets that set the sky ablaze to up-close encounters with playful dolphins, Whyalla invites you to dive into its extraordinary blend of industry, nature and culture.\",\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Events Whyalla\",\"pageUrl\":\"/events\",\"imageUrl\":\"/sites/whyallapwa/media/images/mascot-at-dive-site-stony-point-06.06.2020.jpg\",\"description\":\"Unearth the vibrancy of Whyalla at local events, markets, visiting shows and exhibitions. Enjoy local craftsmanship, motor sports, festivals and live theatre and music.\",\"tileDesc\":\"Unearth the vibrancy of Whyalla at local events, markets, visiting shows and exhibitions. Enjoy local craftsmanship, motor sports, festivals and live theatre and music.\",\"tileButtonText\":\"Unearth Events >\",\"bottomImageUrl\":\"/sites/whyallapwa/media/images/old-main-img/_dsc1855.jpg|/sites/whyallapwa/media/images/old-main-img/230318markets.jpg|/sites/whyallapwa/media/images/old-main-img/chadstone3.jpg|/sites/whyallapwa/media/images/old-main-img/event.jpg|/sites/whyallapwa/media/images/old-main-img/mel-and-me.png|/sites/whyallapwa/media/images/
