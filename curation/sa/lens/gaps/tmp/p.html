g/media/banners/sightings-back-3.jpg"},{"key":"BackgroundTile","value":""}],"items":[{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"14d4a161-2e6d-4492-9b9a-14da846086ca","payloads":[{"key":"Content","value":"<p>&nbsp;</p>\n\n<h2><strong><span style=\"color:#FFFFFF\">Shark Sightings</span></strong></h2>\n\n<h3><span style=\"color:#FFFFFF\">We are the only&nbsp;operator in Australia that publicises current and historic sightings.</span></h3>\n\n<h5><span style=\"color:#FFFFFF\">As we are dealing with a nomadic creature in its natural environment, we cannot suggest when would be the best time to join us as each year can be different. Please use this to help you decide on the best time to come.&nbsp; We provide this information to be open and honest with all our guests to help you make an informed decision.</span></h5>\n\n<h4><span style=\"color:#FFFFFF\">PLEASE NOTE: These results are our figures NOT of any other operator.&nbsp;</span><br>\n&nbsp;</h4>\n\n<p><strong><span style=\"color:#FFFFFF\"><u><a class=\"button\" href=\"/sites/sharkcagediving/media/pdf/SIGHTINGS-1.pdf\" target=\"_blank\"><span>DOWNLOAD</span></a></u> OUR HISTORICAL DAY BY DAY&nbsp;SIGHTINGS SINCE JANUARY&nbsp;1st 2011.&nbsp;</span></strong></p>\n\n<h3 style=\"text-align: center;\"><strong><span style=\"color:#FFFFFF\">Recent Great White Shark Sightings</span></strong></h3>\n"}],"items":[]},{"itemTypeCode":"SightingView","cssClass":null,"anchorName":null,"itemId":"df517ccc-2397-43a3-a2cb-d1767017ebf3","payloads":[],"items":[]},{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"0e1a7f8d-20c9-4245-98e2-28e23e38b304","payloads":[{"key":"Content","value":"<p style=\"text-align: center;\">&nbsp;&nbsp;</p>\n"}],"items":[]}]},{"itemTypeCode":"Panel","cssClass":null,"anchorName":null,"itemId":"e6a262e7-069f-47a6-9062-0d55b0fc9d4e","payloads":[{"key":"Wave","value":"both"},{"key":"TextColorTheme","value":""},{"key":"BgColor","value":""},{"key":"ImageUrl","value":""},{"key":"BackgroundTile","value":""}],"items":[{"itemTypeCode":"PageTiles","cssClass":null,"anchorName":null,"itemId":"01df73dd-963c-4804-92ed-5c5f052618f1","payloads":[{"key":"SelectedPages","value":"f79a95ae-ffc3-4e0b-8c55-3a445ec527af,049563f5-c78c-4c13-b262-144b587a68d3,9caba75e-23b8-4e57-ac83-352c2d6b48ff,ba9caeee-5e93-4156-8fe4-f274fa1ff4fd,b17368fe-de96-4110-8e84-9c1dcdd7f105,6d7fef3f-eaba-418c-8c5e-5f4de1f27896"},{"key":"UseSlider","value":"default"},{"key":"TileType","value":"2"},{"key":"PageObjects","value":"[{\"pageTitle\":\"Book Tours & Gift Vouchers\",\"pageUrl\":\"/book-tours/calypso-tours-calendar\",\"imageUrl\":\"/sites/sharkcagediving/media/images/rob-shark.jpg\",\"description\":\"Awarded Australia’s Best Tourist Attraction in 2019 at the Australian Tourism Awards! Voted South Australia's Best Attraction in 2018 & 2019. Calypso Star Charters offers Advanced Eco Certified Shark Cage Diving and Swim with the Sea Lion tours.\",\"tileDesc\":\"Want to book a tour or buy a Gift Voucher?  We have all our available charter dates listed on our calendar.\\r\\n\",\"tileButtonText\":null,\"bottomImageUrl\":null,\"colorTheme\":null,\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Environmental Sustainability\",\"pageUrl\":\"/environment\",\"imageUrl\":\"/sites/sharkcagediving/media/images/sunrise.jpg\",\"description\":\"Calypso takes pride in sustainable tourism, accredited through Eco Tourism Australia for our Shark Cage Diving and Swim with the Sea Lions tours. \",\"tileDesc\":\"Calypso takes pride in sustainable tourism, accredited through Eco Tourism Australia for our Shark Cage Diving and Swim with the Sea Lions tours. \",\"tileButtonText\":null,\"bottomImageUrl\":null,\"colorTheme\":null,\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"News & Blog\",\"pageUrl\":\"/blog\",\"imageUrl\":\"/sites/sharkcagediving/media/blog/hans-banner.jpg\",\"description\":\"Want to keep updated about all things Calypso Star Charters?  Check out our blog which we update with current information and special guests!\\r\\n\",\"tileDesc\":\"Want to keep updated about all things Calypso Star Charters?  Check out our blog which we update with current information and special guests!\\r\\n\",\"tileButtonText\":null,\"bottomImageUrl\":null,\"colorTheme\":null,\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Accommodation\",\"pageUrl\":\"/accommodation\",\"imageUrl\":\"/sites/sharkcagediving/media/banners/plh2.jpg\",\"description\":\"The award winning Port Lincoln Hotel offers an exclusive deal of a $10 food & beverage voucher (per person, per stay) and free return transfers to the marina on the day of your shark dive for Calypso Star Charters guests for direct bookings only.\",\"tileDesc\":\"The award winning Port Lincoln Hotel offers an exclusive deal of a $10 food & beverage voucher (per person, per stay) and free return transfers to the marina on the day of your shark dive for Calypso Star Charters guests for direct bookings only.\",\"tileButtonText\":null,\"bottomImageUrl\":null,\"colorTheme\":null,\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"How to Get Here\",\"pageUrl\":\"/how-to-get-here\",\"imageUrl\":\"/sites/sharkcagediving/media/banners/marina-2.jpg\",\"description\":\"Drive - It is approximately a 7-hour drive from Adelaide. Fly - It is a short 40-minute flight from Adelaide Airport. We recommend flying with Regional Express Airlines, which operates multiple flights per day. \",\"tileDesc\":\"Drive - It is approximately a 7-hour drive from Adelaide. Fly - It is a short 40-minute flight from Adelaide Airport. We recommend flying with Regional Express Airlines, which operates multiple flights per day. \",\"tileButtonText\":null,\"bottomImageUrl\":null,\"colorTheme\":null,\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null},{\"pageTitle\":\"Things To Do\",\"pageUrl\":\"/things-to-do\",\"imageUrl\":\"/sites/sharkcagediving/media/images/tour-oyster-web-2.jpg\",\"description\":\"Port Lincoln and our surroundings is a wonderful place to visit.  Most guests comment on how they should have stayed here longer!  Read more about Things to Do, places to eat and our National Parks!\",\"tileDesc\":\"Port Lincoln and our surroundings is a wonderful place to visit.  Most guests comment on how they should have stayed here longer!  Read more about Things to Do, places to eat and our National Parks!\",\"tileButtonText\":null,\"bottomImageUrl\":null,\"colorTheme\":null,\"postDate\":null,\"categoryName1\":null,\"categoryName2\":null,\"categoryName3\":null}]"}],"items":[]}]},{"itemTypeCode":"ImagePanel","cssClass":null,"anchorName":null,"itemId":"e67d511f-0b33-4e8a-b87a-324d6d8afb72","payloads":[{"key":"HeightSet","value":"small"},{"key":"ImageUrl","value":"/sites/sharkcagediving/media/banners/sealion-merri-web.jpg"},{"key":"HideTop","value":"0"},{"key":"HideBottom","value":"0"},{"key":"PhotoCredit","value":""}],"items":[]},{"itemTypeCode":"Panel","cssClass":null,"anchorName":null,"itemId":"8c12da2c-6e80-4295-a954-0bd43341f0f4","payloads":[{"key":"Wave","value":"top"},{"key":"TextColorTheme","value":""},{"key":"BgColor","value":""},{"key":"ImageUrl","value":""},{"key":"BackgroundTile","value":""}],"items":[{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"476bdfec-d790-48e0-84bb-b03eb4e2c0ad","payloads":[{"key":"Content","value":"<h2><strong>Why book direct&nbsp;with&nbsp;Calypso Star Charters?</strong></h2>\n\n<ul>\n\t<li>We are available 24 hours a day &amp; bookings can be made direct online or phone&nbsp;+61 8 8682 3939.</li>\n\t<li>Live availability &amp; instant confirmation. Secure your booking immediately.</li>\n\t<li>Best price available - &nbsp;Nowhere else online you will find a better price.</li>\n\t<li>Flexibility - Booking direct allows you to reschedule or postpone up to 7 days before with no extra cost.</li>\n\t<li>Lowest cancellation fee - &nbsp;If for any unforeseen circumstances you do need to cancel, our cancellation fee will be the lowest.</li>\n\t<li>Bookings received through a third party/travel agents/online travel agents may be subject to varying cancellation and refund policies. Calypso Star Charters is not liable for losses incurred through booking via a third party agent.</li>\n\t<li>Secure and safe transition - We use the industry best standard, your details are safe with us.&nbsp; The option to direct debit is also available.</li>\n\t<li>We also book packages&nbsp;which includes tours, accommodation and transfers.&nbsp; Click&nbsp;<strong><a href=\"/packages\">HERE</a></strong>&nbsp;to find out more information.</li>\n</ul>\n\n<p>We are Shark Cage Diving &amp; Swimming with the Sealion experts we do not sell any other tours and have expert knowledge of the area, and the wildlife.&nbsp; You can ask us any question!</p>\n\n<p>Whilst we are happy for you to use your preferred travel arranger to book with us, but please if you do make sure you ask for us directly and check your paperwork to make sure you have been booked on with us to avoid any disappointment.</p>\n\n<p><a class=\"button\" href=\"/book-tours/calypso-tours-calendar\"><span><strong>CHECK AVAILABILITY &amp; BOOK</strong></span></a><br>\n&nbsp;</p>\n"}],"items":[]}]},{"itemTypeCode":"Panel","cssClass":null,"anchorName":"video","itemId":"38c891a0-c998-4808-a7cc-93097f2025d7","payloads":[{"key":"Wave","value":"top"},{"key":"TextColorTheme","value":""},{"key":"BgColor","value":"#000000"},{"key":"ImageUrl","value":""},{"key":"BackgroundTile","value":""}],"items":[{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"645000b9-22c5-498b-9b22-3a0b4d69cb16","payloads":[{"key":"Content","value":"<h2 style=\"text-align: center;\"><span style=\"color:#FFFFFF\">Calypso Star</span>&nbsp;<span style=\"color:#FFFFFF\"><strong>VIDEOS</strong></span></h2>\n\n<div class=\"ytvideo\" style=\"text-align: center;\"><iframe frameborder=\"0\" src=\"https://www.youtube.com/embed/P3wWZZlqG2E?list=PLbW4Dudt7KwyUXufjxGuL43CNzIlel35I\"></iframe></div>\n\n<p style=\"text-align: center;\"><br>\n<span style=\"color:#FFFFFF\">Watch our videos to see how amazing it is to experience a <strong>Calypso Star Charter.</strong></span></p>\n"}],"items":[]}]}]},{"sectionName":"Main","items":[{"itemTypeCode":"Panel","cssClass":"common-footer","anchorName":"contact","itemId":"f1d87968-a3c2-477c-878b-7b0fea1f606e","payloads":[{"key":"Wave","value":"top"},{"key":"TextColorTheme","value":""},{"key":"BgColor","value":""},{"key":"ImageUrl","value":""},{"key":"BackgroundTile","value":""}],"items":[{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"fd26e4cc-769b-4d23-87f4-d6618fe6988a","payloads":[{"key":"Content","value":"<h4 style=\"text-align: center;\"><a href=\"http://www.tripadvisor.com.au/Attraction_Review-g499726-d1487321-Reviews-Calypso_Star_Charters-Port_Lincoln_South_Australia.html\" rel=\"noopener noreferrer\" target=\"_blank\"><img alt=\"\" src=\"/sites/sharkcagediving/media/images/ta-2024-150-177.jpg\"></a></h4>\n\n<h4 style=\"text-align: center;\">Read our Reviews on <a href=\"https://www.tripadvisor.com.au/Attraction_Review-g499726-d1487321-Reviews-Calypso_Star_Charters-Port_Lincoln_South_Australia.html\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Trip Advisor</strong></a></h4>\n\n<p>&nbsp;</p>\n\n<h2 style=\"text-align: center;\"><strong>Contact Us </strong></h2>\n\n<p style=\"text-align: center;\"><strong>Within Australia</strong></p>\n\n<h4 style=\"text-align: center;\"><strong><a class=\"button\" href=\"tel:+61886823939\"><span>(08) 8682 3939</span></a></strong></h4>\n\n<p style=\"text-align: center;\"><strong><span>Outside Australia</span></strong></p>\n\n<h4 style=\"text-align: center;\"><strong><a class=\"button\" href=\"tel:+61886823939\"><span>+61 (8) 8682 3939</span></a></strong><br>\n&nbsp;</h4>\n\n<h4 style=\"text-align: center;\">&nbsp;</h4>\n\n<hr>\n<h5 style=\"text-align: center;\"><strong>Office Location</strong><br>\n3/10 South Quay Boulevard, Port Lincoln SA 5606<br>\nPostal PO Box 2058, Port Lincoln, South Australia, 5606<br>\n<a href=\"/dive-locations\"><strong>Dive Locations</strong></a> - Read about our Dive Locations</h5>\n\n<h5 style=\"text-align: center;\"><strong>Office Opening Hours </strong><br>\nMonday - Friday 9:00am - 5.00pm<br>\nSaturdays, Sundays &amp; Public Holidays - Closed but sometimes open&nbsp;10.00am - 2.00pm</h5>\n\n<hr>\n<p style=\"text-align: center;\">You can also contact us by filling out the form below and pressing&nbsp;<strong>send message</strong>.</p>\n"}],"items":[]},{"itemTypeCode":"ContactForm","cssClass":null,"anchorName":null,"itemId":"1904a89f-46db-4f63-949b-982e214709b8","payloads":[{"key":"EmailReceiver","value":"CfDJ8Kd9yIVSwpNJrQKYTadVFI7KGwJyR8hXk7Zpqs182ZPqFM6Q_kS-YRDMHFRNm2YRo0gWbFWeU4mmEbIa_RhyEqQv0ASTxGmClPYs4vzSMib3GvCxZoZ6zAIQbZia7ez0n6GhKYRS8Q-zzX22_VxyS6M"},{"key":"FileAttachment","value":"false"}],"items":[]},{"itemTypeCode":"Html","cssClass":null,"anchorName":null,"itemId":"77e56160-09e5-445b-968e-5e9cf6738cf4","payloads":[{"key":"Content","value":"<h5 style=\"text-align: center;\"><a href=\"https://www.facebook.com/calypsostarcharters\" rel=\"noopener noreferrer\" target=\"_blank\"><img alt=\"\" src=\"/sites/sharkcagediving/media/images/facebook.png\" /></a>&nbsp; &nbsp;&nbsp;<a href=\"https://www.instagram.com/calypsostarcharters/?ref=badge\" rel=\"noopener noreferrer\" target=\"_blank\"><img alt=\"\" src=\"/sites/sharkcagediving/media/images/instagram.png\" /></a>&nbsp; &nbsp;&nbsp;<a href=\"https://twitter.com/sharkcagediving\" rel=\"noopener noreferrer\" target=\"_blank\"><img alt=\"\" height=\"50px\" src=\"/sites/sharkcagediving/media/images/x-60.png\" width=\"50px\" /></a>&nbsp; &nbsp;&nbsp;<a href=\"https://www.youtube.com/c/Calypsostarcharters\" rel=\"noopener
